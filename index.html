<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT-МОНОПОЛИЯ: БИТВА КОРПОРАЦИЙ</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu-screen" class="screen active">
  <h1>&gt; IT-MONOPOLY.exe</h1>
  <p class="subtitle">// CORPORATE BATTLE // 30 CELLS</p>

  <div class="menu-box">
    <h2>// НАСТРОЙКА ИГРЫ</h2>

    <div class="menu-row">
      <label>Игроков:</label>
      <div class="radio-group">
        <button class="num-btn active" data-num="2">2</button>
        <button class="num-btn" data-num="3">3</button>
        <button class="num-btn" data-num="4">4</button>
      </div>
    </div>

    <div id="players-config"></div>

    <div class="menu-buttons">
      <button id="start-btn" class="btn-primary">[ START ]</button>
      <button id="help-btn" class="btn-secondary">[ HELP ]</button>
    </div>
  </div>
</div>

<div id="game-screen" class="screen">
  <div class="game-layout">
    <aside id="left-panel" class="side-panel"></aside>

    <main class="board-area">
      <div class="board" id="board"></div>

      <div class="center-panel">
        <h2>&gt; IT-MONOPOLY.exe</h2>
        <div id="turn-info" class="turn-info">Ожидание...</div>
        <div class="dice-container">
          <canvas id="dice-canvas" width="100" height="100"></canvas>
        </div>
        <div class="controls">
          <button id="roll-btn" class="btn-primary">[ ROLL ]</button>
          <button id="skip-btn" class="btn-secondary">[ SKIP $50 ]</button>
        </div>
        <div class="controls">
          <button id="stats-btn" class="btn-secondary">[ STATS ]</button>
          <button id="help-game-btn" class="btn-secondary">[ HELP ]</button>
        </div>
        <div class="controls">
          <button id="save-btn" class="btn-secondary">[ SAVE ]</button>
          <button id="reset-btn" class="btn-danger">[ RESET ]</button>
          <button id="menu-btn" class="btn-danger">[ MENU ]</button>
        </div>
        <div class="log-container">
          <div class="log-title">// system.log</div>
          <div id="log" class="log"></div>
        </div>
      </div>
    </main>

    <aside id="right-panel" class="side-panel"></aside>
  </div>
</div>

<div id="modal-overlay" class="modal-overlay">
  <div id="modal-box" class="modal-box"></div>
</div>

<script src="script.js"></script>
</body>
</html>
